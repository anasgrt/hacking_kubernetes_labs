---
# Verified against Docker Hub on 2026-09-23: this digest is the current
# python:3.13-slim tag and carries linux/arm64 and linux/amd64.
hk_lab_image: >-
  docker.io/library/python:3.13-slim@sha256:8d9d0b8bcf6506481eae4907c18f5e3e7902e629f5f6d684f9e7c32e85e3ddf0

hk_user: vagrant
hk_lab_root: /home/vagrant/labs
hk_store: /opt/hk-labs

# Namespaces the chapter examples (outside the numbered labs) expect. Created
# once when the VM is configured, not per lab.
hk_study_namespaces:
  - study
  - study-net
  - study-policy

hk_psa_version: v1.30

# One VM carries every capability, so all of these are on.
hk_cluster: true
hk_gvisor: true
hk_falco: true
hk_runtime_class: gvisor
hk_runtime_handler: runsc
hk_falco_namespace: falco
hk_falco_driver: modern_ebpf
