# Loaded via ANSIBLE_CONFIG, which bin/hk exports. Ansible only auto-discovers
# ansible.cfg in the current directory, and we run from the repo root, so
# without that export these settings are silently ignored.
[defaults]
host_key_checking     = False
# The old `stdout_callback = yaml` pointed at community.general.yaml, removed
# in that collection's v12. ansible-core has done this natively since 2.13 via
# callback_result_format (the ini key is NOT `result_format`, which is ignored).
stdout_callback         = default
callback_result_format  = yaml
display_skipped_hosts = False
interpreter_python    = /usr/bin/python3
retry_files_enabled   = False
deprecation_warnings  = False
# roles/ is found automatically next to each playbook; inventory always comes
# from -i, so neither is set here — relative paths would resolve against the
# working directory rather than this file.

[ssh_connection]
pipelining = True
# No custom ssh_args: overriding it drops Ansible's own -o ControlPath, so
# ControlMaster=auto ends up with no socket and transfers fail part-way with
# "Data could not be sent to remote host". The defaults already multiplex.
