---
# Rancher's chart bootstrapPassword only seeds a NEW installation; it cannot
# change an account that already exists. Reconciling the password on every run
# means the credential in labs.yml is always the one that works — at the cost
# of overwriting a password set in the UI, which is the right trade for a lab.

- name: Wait for Rancher before touching the admin account
  ansible.builtin.command:
    argv:
      - "{{ hk_rke2_kubectl }}"
      - "--kubeconfig={{ hk_rke2_kubeconfig }}"
      - "--namespace={{ hk_rancher_namespace }}"
      - rollout
      - status
      - deployment/rancher
      - --timeout=600s
  changed_when: false

- name: Find the default admin account
  ansible.builtin.command:
    argv:
      - "{{ hk_rke2_kubectl }}"
      - "--kubeconfig={{ hk_rke2_kubeconfig }}"
      - --request-timeout=15s
      - get
      - users.management.cattle.io
      - -l
      - authz.management.cattle.io/bootstrapping=admin-user
      - -o
      - json
  register: hk_rancher_admin
  until: hk_rancher_admin.rc == 0 and (hk_rancher_admin.stdout | from_json)['items'] | length == 1
  retries: 24
  delay: 5
  changed_when: false

- name: Require the expected admin username
  ansible.builtin.assert:
    that: (hk_rancher_admin.stdout | from_json)['items'][0].username == 'admin'
    fail_msg: >-
      The default Rancher account has been renamed. Refusing to print a login
      that is not the real one; set the password through the UI instead.

- name: Set the admin password through the management API
  ansible.builtin.command:
    argv:
      - "{{ hk_rke2_kubectl }}"
      - "--kubeconfig={{ hk_rke2_kubeconfig }}"
      - --request-timeout=30s
      - create
      - -f
      - '-'
      - -o
      - json
    stdin: >-
      {{ {'apiVersion': 'ext.cattle.io/v1',
          'kind': 'PasswordChangeRequest',
          'spec': {'userID': (hk_rancher_admin.stdout | from_json)['items'][0].metadata.name,
                   'newPassword': hk_rancher_admin_password}} | to_json }}
  register: hk_rancher_pwchange
  until: hk_rancher_pwchange.rc == 0
  retries: 12
  delay: 5
  changed_when: true
  no_log: true

- name: Require the password change to have completed
  ansible.builtin.assert:
    that: (hk_rancher_pwchange.stdout | from_json).status.summary == 'Completed'
    fail_msg: Rancher did not complete the admin password change.
  no_log: true

- name: Verify that login actually works over HTTPS
  # Proves the certificate, the ingress and the credential together. A lab that
  # cannot be logged into is not configured, however healthy its Pods look.
  ansible.builtin.uri:
    url: "https://{{ hk_rancher_hostname }}/v3-public/localProviders/local?action=login"
    method: POST
    body_format: json
    body:
      username: admin
      password: "{{ hk_rancher_admin_password }}"
      responseType: json
      description: hk mgmt configure verification
      ttl: 60000
    ca_path: "{{ hk_rancher_tls }}/ca.crt"
    validate_certs: true
    use_proxy: false
    status_code: 201
  register: hk_rancher_login
  until: hk_rancher_login.status == 201
  retries: 12
  delay: 5
  no_log: true

- name: Revoke the verification token
  ansible.builtin.uri:
    url: "https://{{ hk_rancher_hostname }}/v3/tokens?action=logout"
    method: POST
    headers:
      Authorization: "Bearer {{ hk_rancher_login.json.token }}"
    ca_path: "{{ hk_rancher_tls }}/ca.crt"
    validate_certs: true
    use_proxy: false
    status_code: [200, 204]
  failed_when: false
  no_log: true
