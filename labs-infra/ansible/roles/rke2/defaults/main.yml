---
# Overridden from labs.yml's rancher block by ansible/mgmt.yml.
hk_rke2_version: v1.35.8+rke2r1

hk_rke2_node_name: hk-mgmt-node
hk_rke2_kubeconfig: /etc/rancher/rke2/rke2.yaml
# RKE2 ships its own kubectl rather than putting one on PATH.
hk_rke2_kubectl: /var/lib/rancher/rke2/bin/kubectl

# RKE2's own defaults, stated rather than assumed. These do not collide with
# the lab VM's k3s: the two clusters are on two machines, which is the whole
# reason there are two machines.
hk_rke2_cluster_cidr: 10.42.0.0/16
hk_rke2_service_cidr: 10.43.0.0/16
hk_rke2_cluster_dns: 10.43.0.10
